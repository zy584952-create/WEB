<div class="container">
    <header>
        <h1>ABOUT US</h1>
        <button class="exit-btn" onclick="window.location.href='../index.html'" style="cursor: pointer">Exit</button>
    </header>

    <div class="gallery-wrapper">
        <div class="gallery-track" id="galleryTrack">
            <img src="pink.png" alt="Can 1" class="gallery-item">
            <img src="yellowandblue.png" alt="Can 2" class="gallery-item">
            <img src="orange1.png" alt="Can 3" class="gallery-item">
            <img src="purple.png" alt="Can 4" class="gallery-item">
            <img src="orangeandpurple.png" alt="Can 5" class="gallery-item">
            <img src="green1.png" alt="Can 6" class="gallery-item">
        </div>
    </div>

    <div class="slider-container">
        <input type="range" min="0" max="100" value="0" id="imageSlider">
    </div>

    <section class="bottom-section">
        <div class="card">
            <h2>SUBMIT A REQUEST</h2>
            <div class="request-area">
                <input type="email" placeholder="Enter your email...">
                <button type="button" aria-label="Submit">→</button>
            </div>
            <p class="request-desc">Stay updated with our latest drinks and offers.</p>
        </div>

        <div class="card">
            <h2>CONNECT US</h2>
            <div class="contact-info">
                <div class="contact-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <span><strong>EMAIL:</strong> hello@beverage.com</span>
                </div>
                <div class="contact-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <span><strong>TELEPHONE:</strong> +1 234 567 890</span>
                </div>
            </div>
        </div>
    </section>
</div>
