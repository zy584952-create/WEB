            </div>

            <div class="hero-visuals" onclick="rotateCans()">

            <div class="info-item">
                <div class="user-avatars">
                    <div class="avatar" style="background-image: url('female1.jpg')"></div>
                    <div class="avatar" style="background-image: url('female2.jpg')"></div>
                </div>
                <div class="rating-box">
                    <span class="rating-score">4.5 ★</span><br>
                    <span style="font-size: 0.8rem">Custom Rating</span>
                </div>
            </div>
        </section>

        <section class="about-section">

            <div class="gallery">
                <div class="gallery-item img-1"><img src="drinkwater.jpg" style="width: 100%; height: 100%; object-fit: cover;"></div>
                <div class="gallery-item img-2"><img src="fruit.jpg" style="width: 100%; height: 100%; object-fit: cover;"></div>
                <div class="gallery-item img-3"><img src="drink2.jpg" style="width: 100%; height: 100%; object-fit: cover;"></div>
